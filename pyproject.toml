[project]
name = "forex-signals"
version = "0.1.0"
description = "A production-style forex trading signals system with backtesting, risk management, and a REST API."
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "pydantic==2.6.1",
    "python-dateutil==2.8.2",
    "typer==0.12.3",
    "rich==13.7.1",
]

[project.scripts]
forex-signals = "src.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]